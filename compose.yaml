services:
  app:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgres://docs2api:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/docs2api
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      DOCS2API_PROVIDER: ${DOCS2API_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      DOCS2API_MODE: hosted
      AI_MAX_CALLS_PER_SESSION: 3
      AI_MAX_CALLS_TOTAL: 30
      AI_MAX_OUTPUT_TOKENS: 8000
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docs2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: docs2api
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs2api"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres:
  appdata:
